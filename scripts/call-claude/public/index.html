<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Call Claude</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="splash" class="splash" role="button" aria-label="tap to start">
      <div class="splash-big">START</div>
      <div class="splash-hint">tap anywhere</div>
    </div>
    <main id="app">
      <div id="orb" aria-hidden="true"></div>

      <div id="state" class="state">tap to start</div>

      <div id="log" class="log" aria-live="polite"></div>

      <div class="controls">
        <button id="muteBtn" class="btn toggle" aria-pressed="false" disabled>mute mic</button>
        <button id="stopBtn" class="btn" disabled>stop</button>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
