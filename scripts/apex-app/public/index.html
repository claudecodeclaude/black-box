<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Apex</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <h1 class="brand">APEX</h1>
      <p class="tagline">Staff hub &middot; HIPAA-secured &middot; Tailnet only</p>

      <form class="login" autocomplete="off" onsubmit="event.preventDefault(); alert('Auth not wired up yet — this is the scaffold.');">
        <label>
          <span>Username</span>
          <input type="text" name="username" disabled placeholder="coming soon" />
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" disabled placeholder="coming soon" />
        </label>
        <label>
          <span>6-digit code</span>
          <input type="text" name="code" disabled inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="MFA" />
        </label>
        <button type="submit" disabled>Sign in</button>
      </form>

      <div class="status">
        <strong>Status:</strong> scaffold live on Tailnet. Next: SQLite + users + bcrypt + TOTP MFA + audit log + RBAC.
      </div>
    </main>
  </body>
</html>
